<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Commit Analyzer{% endblock %}</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <style>
    :root { --bg:#0d1117; --panel:#161b22; --border:#30363d; --text:#e6edf3; --muted:#8b949e; --accent:#3fb950; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, sans-serif; background:var(--bg); color:var(--text); }
    main { max-width: 1000px; margin: 0 auto; padding: 24px 16px; }
    a { color: #58a6ff; text-decoration: none; }
    h1 { margin: 0 0 4px; } .muted { color: var(--muted); }
    .panel { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:16px; margin:16px 0; }
    .tiles { display:grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap:12px; }
    .tile .value { font-size: 1.8rem; font-weight: 700; } .tile .label { color:var(--muted); font-size:.85rem; }
    .grid2 { display:grid; grid-template-columns: repeat(auto-fit, minmax(300px,1fr)); gap:16px; }
    table { width:100%; border-collapse: collapse; } th, td { text-align:left; padding:8px; border-bottom:1px solid var(--border); }
    input, select, button { background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:8px 10px; font: inherit; }
    button { background: var(--accent); color:#000; border:none; cursor:pointer; font-weight:600; }
    .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    .heatmap { display:grid; grid-template-rows: repeat(7, 11px); grid-auto-flow: column; grid-auto-columns: 11px; gap:3px; overflow-x:auto; }
    .heatmap div { border-radius:2px; background:#161b22; outline:1px solid #21262d; }
  </style>
</head>
<body><main>{% block content %}{% endblock %}</main></body>
</html>
